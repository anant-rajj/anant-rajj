<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <linearGradient id="st-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <linearGradient id="st-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a26" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <style>
    @keyframes barGrow {
      0%, 100% { transform: scaleY(0.6); }
      50% { transform: scaleY(1); }
    }
    @keyframes dotFlicker {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .live-dot { animation: dotFlicker 1.8s infinite; }
    .b-1 { animation: barGrow 1.5s ease-in-out infinite; transform-origin: bottom; }
    .b-2 { animation: barGrow 1.2s ease-in-out infinite 0.2s; transform-origin: bottom; }
    .b-3 { animation: barGrow 1.7s ease-in-out infinite 0.4s; transform-origin: bottom; }
    .b-4 { animation: barGrow 1.4s ease-in-out infinite 0.1s; transform-origin: bottom; }
  </style>

  <rect width="900" height="160" rx="10" fill="#080a0f" stroke="#242b38" stroke-width="1" />

  <!-- Top Banner -->
  <g transform="translate(30, 24)">
    <circle cx="6" cy="6" r="4" fill="#00ff88" class="live-dot" />
    <text x="20" y="9" fill="#00f2fe" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1">
      LIVE TELEMETRY // VERIFIED COMMIT CADENCE &amp; WORKSPACE VITALS
    </text>
  </g>

  <!-- 4 Telemetry Stat Metric Pods -->
  <g transform="translate(30, 48)">

    <!-- Pod 1: Repositories & Systems -->
    <g transform="translate(0, 0)">
      <rect width="195" height="85" rx="6" fill="url(#st-box)" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" />
      <text x="16" y="24" fill="#8b949e" font-family="ui-monospace, monospace" font-size="10">REPOSITORIES ACTIVE</text>
      <text x="16" y="54" fill="#f0f6fc" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="800">21+</text>
      <text x="16" y="72" fill="#00f2fe" font-family="ui-monospace, monospace" font-size="9.5">macOS &bull; Security &bull; AI</text>
    </g>

    <!-- Pod 2: Low-Level Footprint -->
    <g transform="translate(215, 0)">
      <rect width="195" height="85" rx="6" fill="url(#st-box)" stroke="#38ef7d" stroke-width="1" stroke-opacity="0.3" />
      <text x="16" y="24" fill="#8b949e" font-family="ui-monospace, monospace" font-size="10">LOWEST BINARY SIZE</text>
      <text x="16" y="54" fill="#00ff88" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="800">~24 KB</text>
      <text x="16" y="72" fill="#38ef7d" font-family="ui-monospace, monospace" font-size="9.5">mac-insomnia (IOKit)</text>
    </g>

    <!-- Pod 3: Deterministic Test Score -->
    <g transform="translate(430, 0)">
      <rect width="195" height="85" rx="6" fill="url(#st-box)" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.3" />
      <text x="16" y="24" fill="#8b949e" font-family="ui-monospace, monospace" font-size="10">DETERMINISTIC SUITE</text>
      <text x="16" y="54" fill="#58a6ff" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="800">42 / 42</text>
      <text x="16" y="72" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="9.5">100% CI Green Rate</text>
    </g>

    <!-- Pod 4: Active R&D Track -->
    <g transform="translate(645, 0)">
      <rect width="195" height="85" rx="6" fill="url(#st-box)" stroke="#d29922" stroke-width="1" stroke-opacity="0.3" />
      <text x="16" y="24" fill="#8b949e" font-family="ui-monospace, monospace" font-size="10">COMPETITION TRACK</text>
      <text x="16" y="54" fill="#d29922" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800">ADVANCED</text>
      <text x="16" y="72" fill="#d29922" font-family="ui-monospace, monospace" font-size="9.5">E-Cell IIT Bombay NEC</text>
    </g>

  </g>
</svg>

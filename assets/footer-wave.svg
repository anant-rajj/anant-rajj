<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="100%" height="100%">
  <defs>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00ff88" stop-opacity="1" />
      <stop offset="75%" stop-color="#4facfe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes lineFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 100; }
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: lineFlow 3s linear infinite;
    }
  </style>

  <rect width="900" height="40" fill="transparent" />
  <line x1="20" y1="20" x2="880" y2="20" stroke="url(#wave-grad)" stroke-width="1.5" class="flow-line" />
  <polygon points="450,15 455,20 450,25 445,20" fill="#00ff88" />
</svg>

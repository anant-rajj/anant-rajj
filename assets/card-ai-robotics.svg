<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="ai-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    @keyframes nodeBlink {
      0%, 100% { fill-opacity: 0.3; r: 3; }
      50% { fill-opacity: 1; r: 5; }
    }
    .node-p { animation: nodeBlink 2.2s infinite; }
    .node-c { animation: nodeBlink 2.2s infinite 0.7s; }
    .node-g { animation: nodeBlink 2.2s infinite 1.4s; }
  </style>

  <!-- Card Background -->
  <rect width="440" height="240" rx="10" fill="#0d1117" />
  <rect x="1" y="1" width="438" height="238" rx="9" fill="#121622" stroke="url(#ai-border)" stroke-width="1.2" />

  <!-- Badge / Status -->
  <rect x="20" y="20" width="168" height="22" rx="11" fill="#20172c" stroke="#bc8cff" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="30" cy="31" r="4" fill="#bc8cff" />
  <text x="40" y="35" fill="#bc8cff" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">R&amp;D ARCHITECTURE</text>

  <!-- Title -->
  <text x="20" y="70" fill="url(#ai-grad)" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="800">
    AI Systems &amp; Robotics Lab
  </text>
  <text x="20" y="88" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">
    Multi-Agent Collective &bull; Spider-Bot Platform
  </text>

  <!-- Description -->
  <text x="20" y="116" fill="#c9d1d9" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="400">
    Quota-aware multi-model orchestration with adversarial debate.
  </text>
  <text x="20" y="132" fill="#8b949e" font-family="-apple-system, system-ui, sans-serif" font-size="11.5">
    Multipedal kinematics, PWM servo rails, and telemetry loops.
  </text>

  <!-- Spec Metrics Box -->
  <rect x="20" y="150" width="400" height="42" rx="6" fill="#080a0f" stroke="#242b38" stroke-width="1" />
  
  <text x="32" y="167" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9.5">FLEET DEPARTMENTS</text>
  <text x="32" y="183" fill="#bc8cff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">5 SPECIALIZED</text>

  <text x="160" y="167" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9.5">LOCAL OFFLOAD</text>
  <text x="160" y="183" fill="#00ff88" font-family="ui-monospace, monospace" font-size="11" font-weight="700">OLLAMA 0-COST</text>

  <text x="295" y="167" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9.5">ROBOT KINEMATICS</text>
  <text x="295" y="183" fill="#00d2ff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">TRIPOD GAIT LAB</text>

  <!-- Holographic Node Constellation -->
  <g transform="translate(350, 25)">
    <line x1="10" y1="30" x2="40" y2="10" stroke="#bc8cff" stroke-width="1" opacity="0.4" />
    <line x1="40" y1="10" x2="60" y2="40" stroke="#00f2fe" stroke-width="1" opacity="0.4" />
    <line x1="10" y1="30" x2="60" y2="40" stroke="#00ff88" stroke-width="1" opacity="0.4" />
    <circle cx="10" cy="30" r="4" fill="#bc8cff" class="node-p" />
    <circle cx="40" cy="10" r="4" fill="#00f2fe" class="node-c" />
    <circle cx="60" cy="40" r="4" fill="#00ff88" class="node-g" />
  </g>

  <!-- Bottom Action Hint -->
  <text x="20" y="214" fill="#bc8cff" font-family="ui-monospace, monospace" font-size="10" font-weight="600">
    PORTFOLIO CASE STUDY &rarr; anant-rajj.github.io/portfolio#ai-research
  </text>
</svg>

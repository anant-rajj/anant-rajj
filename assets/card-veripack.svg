<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%">
  <defs>
    <linearGradient id="v-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <linearGradient id="v-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.3" />
    </linearGradient>
    <filter id="v-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes vRadar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes vPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .radar-arm {
      animation: vRadar 4s linear infinite;
      transform-origin: 380px 55px;
    }
    .shield-pulse {
      animation: vPulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Card Background -->
  <rect width="440" height="240" rx="10" fill="#0d1117" />
  <rect x="1" y="1" width="438" height="238" rx="9" fill="#121622" stroke="url(#v-border)" stroke-width="1.2" />

  <!-- Radar Scanner in Corner -->
  <circle cx="380" cy="55" r="32" fill="none" stroke="#242b38" stroke-width="1" />
  <circle cx="380" cy="55" r="20" fill="none" stroke="#242b38" stroke-width="1" />
  <circle cx="380" cy="55" r="8" fill="none" stroke="#00f2fe" stroke-width="1.5" />
  <line x1="380" y1="55" x2="410" y2="40" stroke="#00ff88" stroke-width="1.5" class="radar-arm" opacity="0.8" />

  <!-- Badge / Status -->
  <rect x="20" y="20" width="168" height="22" rx="11" fill="#182232" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="30" cy="31" r="4" fill="#00ff88" />
  <text x="40" y="35" fill="#00d2ff" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">FEATURED TEAM LEAD</text>

  <!-- Title -->
  <text x="20" y="70" fill="url(#v-grad)" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="800">
    VeriPack (pratyancha)
  </text>
  <text x="20" y="88" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">
    Hack Day Sonipat &bull; Problem Statement 04
  </text>

  <!-- Description -->
  <text x="20" y="116" fill="#c9d1d9" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="400">
    Published Package vs Source Code Integrity Analyzer.
  </text>
  <text x="20" y="132" fill="#8b949e" font-family="-apple-system, system-ui, sans-serif" font-size="11.5">
    Detects unmapped backdoors, Zip-Slip, and ghost payloads.
  </text>

  <!-- Spec Metrics Box -->
  <rect x="20" y="150" width="400" height="42" rx="6" fill="#080a0f" stroke="#242b38" stroke-width="1" />
  
  <text x="32" y="167" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9.5">AST CAPABILITY</text>
  <text x="32" y="183" fill="#00ff88" font-family="ui-monospace, monospace" font-size="11" font-weight="700">0 ESCALATION</text>

  <text x="160" y="167" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9.5">SHANNON ENTROPY</text>
  <text x="160" y="183" fill="#00d2ff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">&lt; 5.0b UNIFORM</text>

  <text x="295" y="167" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9.5">UNIT TEST SUITE</text>
  <text x="295" y="183" fill="#3fb950" font-family="ui-monospace, monospace" font-size="11" font-weight="700">42/42 GREEN</text>

  <!-- Bottom Action Hint -->
  <text x="20" y="214" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="10" font-weight="600">
    VIEW LIVE DASHBOARD &rarr; anant-rajj.github.io/pratyancha-hacktoberfest
  </text>
</svg>

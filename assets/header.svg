<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <linearGradient id="grad-cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="grad-cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192a56" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="grad-cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#05c46b" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hud-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern Background -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes scanline {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(280px); opacity: 0; }
    }
    @keyframes float3D {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 120; }
    }
    @keyframes waveBar {
      0%, 100% { height: 6px; }
      50% { height: 26px; }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .status-pulse {
      animation: pulseDot 2s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-cube {
      animation: float3D 6s ease-in-out infinite;
      transform-origin: 750px 140px;
    }
    .scan-beam {
      animation: scanline 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .hud-dash {
      stroke-dasharray: 6 6;
      animation: dashMove 3s linear infinite;
    }
    .wave-1 { animation: waveBar 1.2s ease-in-out infinite; }
    .wave-2 { animation: waveBar 0.9s ease-in-out infinite 0.2s; }
    .wave-3 { animation: waveBar 1.5s ease-in-out infinite 0.4s; }
    .wave-4 { animation: waveBar 1.1s ease-in-out infinite 0.1s; }
    .wave-5 { animation: waveBar 1.3s ease-in-out infinite 0.3s; }
    .cursor { animation: cursorBlink 1s infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="290" fill="#080a0f" rx="12" />
  <rect width="900" height="290" fill="url(#cyber-grid)" rx="12" />

  <!-- Outer Neon Border Frame -->
  <rect x="1.5" y="1.5" width="897" height="287" rx="10.5" fill="none" stroke="url(#hud-line)" stroke-width="1.5" />
  <rect x="5" y="5" width="890" height="280" rx="8" fill="none" stroke="#242b38" stroke-width="1" />

  <!-- Corner Tech Accents -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#00f2fe" stroke-width="2.5" />
  <path d="M 888 28 L 888 12 L 872 12" fill="none" stroke="#00f2fe" stroke-width="2.5" />
  <path d="M 12 262 L 12 278 L 28 278" fill="none" stroke="#00ff88" stroke-width="2.5" />
  <path d="M 888 262 L 888 278 L 872 278" fill="none" stroke="#00ff88" stroke-width="2.5" />

  <!-- Animated Laser Scanline -->
  <line x1="10" y1="0" x2="890" y2="0" stroke="url(#grad-glow)" stroke-width="2" class="scan-beam" />

  <!-- Top Pill / Telemetry Header -->
  <g transform="translate(40, 36)">
    <rect width="365" height="26" rx="13" fill="#121620" stroke="#333d4e" stroke-width="1" />
    <circle cx="16" cy="13" r="5" fill="#00ff88" class="status-pulse" filter="url(#glow-subtle)" />
    <text x="32" y="17" fill="#c9d1d9" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1">
      R&amp;D SYSTEMS &bull; HARDWARE &bull; AI AGENTS
    </text>
  </g>

  <!-- Big Glowing Title: ANANT RAJ -->
  <text x="40" y="112" fill="url(#grad-title)" font-family="-apple-system, system-ui, sans-serif" font-size="46" font-weight="900" letter-spacing="-1" filter="url(#glow-heavy)">
    ANANT RAJ
  </text>
  <text x="40" y="112" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
    ANANT RAJ
  </text>

  <!-- Philosophy Tagline -->
  <text x="42" y="146" fill="#8b949e" font-family="ui-monospace, monospace" font-size="14" font-weight="600" letter-spacing="0.5">
    “I research how systems work. Then I build better ways to make them work.”
  </text>

  <!-- Middle Telemetry Badge Row -->
  <g transform="translate(42, 172)">
    <!-- Badge 1: VeriPack Lead -->
    <rect x="0" y="0" width="168" height="24" rx="4" fill="#141923" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.4" />
    <text x="10" y="16" fill="#00d2ff" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">🛡️ VERIPACK LEAD</text>

    <!-- Badge 2: macOS IOKit -->
    <rect x="178" y="0" width="162" height="24" rx="4" fill="#141923" stroke="#3fb950" stroke-width="1" stroke-opacity="0.4" />
    <text x="188" y="16" fill="#3fb950" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">⚡ MACOS IOKIT/C</text>

    <!-- Badge 3: E-Cell IIT Bombay -->
    <rect x="350" y="0" width="170" height="24" rx="4" fill="#141923" stroke="#d29922" stroke-width="1" stroke-opacity="0.4" />
    <text x="360" y="16" fill="#d29922" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">🏆 IIT BOMBAY NEC</text>
  </g>

  <!-- Bottom Console Status Line -->
  <g transform="translate(42, 230)">
    <rect width="640" height="34" rx="6" fill="#0d1117" stroke="#242b38" stroke-width="1" />
    <text x="14" y="22" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="12" font-weight="700">&gt;</text>
    <text x="30" y="22" fill="#c9d1d9" font-family="ui-monospace, monospace" font-size="12" font-weight="500">
      RESEARCH <tspan fill="#58a6ff">&rarr;</tspan> UNDERSTAND <tspan fill="#58a6ff">&rarr;</tspan> DESIGN <tspan fill="#58a6ff">&rarr;</tspan> IMPLEMENT <tspan fill="#58a6ff">&rarr;</tspan> <tspan fill="#00ff88">IMPROVE</tspan>
    </text>
    <rect x="495" y="11" width="7" height="15" fill="#00ff88" class="cursor" />

    <!-- Mini Telemetry Equalizer Bars -->
    <g transform="translate(580, 24)">
      <rect x="0" y="-14" width="4" height="14" rx="1.5" fill="#00f2fe" class="wave-1" />
      <rect x="8" y="-18" width="4" height="18" rx="1.5" fill="#4facfe" class="wave-2" />
      <rect x="16" y="-10" width="4" height="10" rx="1.5" fill="#00ff88" class="wave-3" />
      <rect x="24" y="-22" width="4" height="22" rx="1.5" fill="#00d2ff" class="wave-4" />
      <rect x="32" y="-12" width="4" height="12" rx="1.5" fill="#3fb950" class="wave-5" />
    </g>
  </g>

  <!-- 3D Isometric Floating Cube Component -->
  <g class="floating-cube">
    <!-- Isometric Cube Shadow / Base Orbit -->
    <ellipse cx="760" cy="210" rx="65" ry="24" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.25" class="hud-dash" />
    <ellipse cx="760" cy="210" rx="42" ry="15" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3" />

    <!-- 3D Cube Top Face -->
    <polygon points="760,65 825,98 760,132 695,98" fill="url(#grad-cube-top)" stroke="#00f2fe" stroke-width="1.5" />
    
    <!-- 3D Cube Left Face -->
    <polygon points="695,98 760,132 760,202 695,168" fill="url(#grad-cube-left)" stroke="#00d2ff" stroke-width="1.5" />
    
    <!-- 3D Cube Right Face -->
    <polygon points="760,132 825,98 825,168 760,202" fill="url(#grad-cube-right)" stroke="#00ff88" stroke-width="1.5" />

    <!-- Inner Core Cyber Glow -->
    <circle cx="760" cy="133" r="16" fill="#00f2fe" opacity="0.6" filter="url(#glow-heavy)" />
    <circle cx="760" cy="133" r="6" fill="#ffffff" />

    <!-- Tech Coordinate Indicators -->
    <text x="760" y="52" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">M5 // SILICON</text>
    <text x="760" y="235" fill="#00ff88" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">IOKIT // 0% IDLE</text>
  </g>

</svg>
